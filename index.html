<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentry.Anywhere</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Oswald:wght@200..700&display=swap');

    </style>

    <style>
        body{
            overflow-y: hidden;
            /*font-family: "Noto Sans", sans-serif;
            font-variation-settings:    "wdth" 100;
            */
            font-family: "Oswald", sans-serif;
            font-optical-sizing: auto;
            font-weight: 300;
            font-style: normal;
            
        }
        .tree-node {
            transition: all 0.2s ease;
        }
        .tree-node.dragging {
            opacity: 0.6;
            background-color: #f3f4f6;
        }
        .tree-node.drag-over {
            background-color: #e5e7eb;
        }
        .tree-children {
            margin-left: 1.5rem;
            border-left: 1px dashed #d1d5db;
        }
        .node-content {
            cursor: pointer;
            user-select: none;
        }
        .resize-handle {
            width: 5px;
            background: transparent;
            cursor: col-resize;
            transition: background 0.2s;
        }
        .resize-handle:hover, .resize-handle.active {
            background: #3b82f6;
        }
        .sidebar {
            min-width: 200px;
            max-width: 80%;
            transition: width 0.25s ease, padding 0.25s ease, opacity 0.2s ease, min-width 0.25s ease;
        }
        .sidebar.collapsed {
            width: 0 !important;
            min-width: 0 !important;
            padding-left: 0 !important;
            padding-right: 0 !important;
            overflow: hidden !important;
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }
        .sidebar.collapsed .resize-handle {
            display: none !important;
        }
        .modal {
            transition: opacity 0.25s ease;
        }
        .node-actions {
            opacity: 0;
            transition: opacity 0.2s;
        }
        .tree-node:hover .node-actions {
            opacity: 1;
        }
        .file-item {
            transition: all 0.2s;
        }
        .file-item:hover {
            background-color: #f3f4f6;
        }
    </style>
    <style>

        .noShow{
            display: none !important;
        }
        .dailyTool{
            display: flex;
            flex-direction: row;
        }

        .dailyTool :hover{
            cursor: pointer;
        }

        .dailyToolAction {
            opacity: 0;
            transition: opacity 0.2s;
        }

        .dailyTool:hover .dailyToolAction {
            opacity: 1;
        }
        
    </style>
    <style>
        .bookmarkItem{
            display: flex;
            flex-direction: row;
            justify-content:flex-start;
            align-items: center;
            gap: 10px;

            /*width:100% ;*/
        }
        .bookmarkItem :hover{
            cursor: pointer;
            color: #3b82f6;
        }

        .bookmarkAction {
            opacity: 0;
            transition: opacity 0.2s;
        }

        .bookmarkItem:hover .bookmarkAction {
            opacity: 1;
        }
        
        .btnOutpost:hover{
            cursor: pointer;
        }
    </style>
    <style>
        /* 紧凑书签网格样式 */
        .bookmarks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 15px;
        }
        
        .bookmark-card {
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            transition: var(--transition);
            padding: 12px;
            display: flex;
            flex-direction: column;
            height: 150px;

            transform: translateY(0px);
        }
        
        .bookmark-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .bookmark-card-add {
            background: #f8fafc;
            border: 2px dashed #cbd5e1;
            border-radius: 8px;
            height: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #64748b;
        }

        .bookmark-card-add:hover {
            border-color: #3b82f6;
            background-color: #eff6ff;
            color: #2563eb;
            transform: translateY(-3px);
            box-shadow: 0 4px 8px rgba(59, 130, 246, 0.15);
        }

        /* 应用快门 经典文件夹切角 Tab 样式（参照对比视觉效果） */
        .app-shutter-tabs {
            display: flex;
            align-items: flex-end;
            gap: 4px;
            padding-left: 8px;
            border-bottom: 3px solid #4b5563;
            margin-bottom: 20px;
            overflow-x: auto;
            position: relative;
        }

        .app-tab-item {
            position: relative;
            padding: 8px 22px 7px 18px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.3px;
            color: #e5e7eb;
            background: linear-gradient(180deg, #6b7280 0%, #4b5563 100%);
            border: 1px solid #4b5563;
            border-bottom: none;
            border-top-left-radius: 6px;
            border-top-right-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
            user-select: none;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
            margin-bottom: 0;
        }

        .app-tab-item:hover {
            background: linear-gradient(180deg, #7c8594 0%, #566170 100%);
            color: #ffffff;
        }

        .app-tab-item.active {
            background: #ffffff;
            color: #111827;
            font-weight: 700;
            border: 1px solid #4b5563;
            border-bottom: 3px solid #ffffff;
            margin-bottom: -3px;
            z-index: 10;
            border-top-left-radius: 6px;
            border-top-right-radius: 14px;
            box-shadow: 0 -3px 8px rgba(0, 0, 0, 0.08);
        }

        .app-tab-item.dragging-tab {
            opacity: 0.45;
            border: 1px dashed #60a5fa !important;
            transform: scale(0.96);
        }

        .app-tab-item.drag-over-tab {
            border-left: 4px solid #3b82f6 !important;
            transform: translateY(-2px);
        }

        .app-tab-add {
            padding: 7px 16px 6px 14px;
            font-size: 13px;
            font-weight: 600;
            color: #d1d5db;
            background: linear-gradient(180deg, #4b5563 0%, #374151 100%);
            border: 1px dashed #9ca3af;
            border-bottom: none;
            border-top-left-radius: 6px;
            border-top-right-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            margin-bottom: 0;
        }

        .app-tab-add:hover {
            background: linear-gradient(180deg, #3b82f6 0%, #2563eb 100%);
            color: #ffffff;
            border-color: #60a5fa;
        }
        
        .bookmark-header {
            display: flex;
            align-items: flex-start;
            margin-bottom: 8px;
            width:100% ;
        }
        
        .bookmark-favicon {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            background: var(--primary-light);
            display: flex;
            align-items: center;
            justify-content: center;
            color:black;
            font-weight: bold;
            margin-right: 10px;
            flex-shrink: 0;
            font-size: 14px;
        }
        
        .bookmark-info {
            flex: 1;
            min-width: 0;
        }
        
        .bookmark-title {
            font-weight: 600;
            margin-bottom: 4px;
            line-height: 1.3;
            font-size: 14px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 10em;

            /*
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            */
        }
        
        .bookmark-url {
            font-size: 10px;
            color: var(--gray);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;

            max-width: 15em;
        }
        
        .bookmark-actions {
            display: flex;
            gap: 5px;
            margin-left: 5px;

            align-items:center
        }
        
        .bookmark-actions button {
            background: none;
            border: none;
            color: var(--gray);
            cursor: pointer;
            padding: 4px;
            border-radius: 3px;
            transition: var(--transition);
            font-size: 12px;
        }
        
        .bookmark-actions button:hover {
            background: var(--gray-light);
            color: var(--dark);
        }
        
        .bookmark-description {
            font-size: 12px;
            color: var(--gray);
            line-height: 1.4;
            margin-bottom: 8px;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            flex: 1;
        }
        
        .bookmark-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--gray);

            width:100%;
        }
        
        .bookmark-tags span {
            background: var(--gray-light);
            padding: 2px 6px;
            border-radius: 10px;
            margin-right: 4px;
        }
    </style>
</head>

    <script>
        function formatDateYYYYMMDD(date) {
            let cDate = new Date(date) ;
            const year = cDate.getFullYear();
            const month = String(cDate.getMonth() + 1).padStart(2, '0');
            const day = String(cDate.getDate()).padStart(2, '0');
            return `${year}${month}${day}`;
        }

        // 颜色方案
        const colorSchemes = {
            vibrant: [
                "#FF6B6B", "#4ECDC4", "#FFD166", "#06D6A0", 
                "#118AB2", "#EF476F", "#7209B7", "#3A86FF"
            ],
            pastel: [
                "#FFADAD", "#9BF6FF", "#CAFFBF", "#FDFFB6",
                "#A0C4FF", "#BDB2FF", "#FFC6FF", "#FFFFFC"
            ],
            monochromatic: [
                "#4361EE", "#4895EF", "#4CC9F0", "#3F37C9",
                "#3A0CA3", "#480CA8", "#560BAD", "#7209B7"
            ]
        };

        // 生成随机颜色
        function getRandomColor(scheme) {
            if (scheme === "random") {
                // 生成完全随机颜色
                const letters = '0123456789ABCDEF';
                let color = '#';
                for (let i = 0; i < 6; i++) {
                    color += letters[Math.floor(Math.random() * 16)];
                }
                return color;
            } else {
                // 从预定义方案中选择颜色
                const colors = colorSchemes[scheme];
                return colors[Math.floor(Math.random() * colors.length)];
            }
        }

        // 从URL提取域名并生成图标文本
        function getIconText(url, mode) {
            try {
                const domain = new URL(url).hostname.replace('www.', '');
                const parts = domain.split('.');
                const mainDomain = parts[0];
                
                switch(mode) {
                    case "first-letter":
                        return mainDomain.charAt(0).toUpperCase();
                    case "first-two":
                        return mainDomain.substring(0, 2).toUpperCase();
                    case "domain":
                        // 取域名前两个字母或整个短域名
                        return mainDomain.length <= 3 ? 
                            mainDomain.toUpperCase() : 
                            mainDomain.substring(0, 2).toUpperCase();
                    default:
                        return mainDomain.charAt(0).toUpperCase();
                }
            } catch (e) {
                return "?";
            }
        }
    </script>
    <script>

        // 目录树渲染功能
        function renderTree(data, parentElement, level = 0) {
            data.forEach(item => {
                const hasChildren = item.children && item.children.length > 0;
                
                const nodeElement = document.createElement('div');
                nodeElement.className = 'tree-node';
                nodeElement.dataset.id = item.id;
                nodeElement.draggable = true;
                
                // 所有节点都显示为文件夹图标
                nodeElement.innerHTML = `
                    <div class="node-content px-2 rounded-lg flex items-center hover:bg-gray-100 group">
                        <span class="toggle-icon mr-2 text-gray-500 ${hasChildren ? '' : 'invisible'}">
                            <i class="fas fa-caret-right"></i>
                        </span>
                        <i class="fas fa-folder text-yellow-500 mr-2"></i>
                        <span class="text-gray-700 flex-grow" style="font-size:18px;">${item.name}</span>
                        <div class="node-actions flex">
                            <i class="fas fa-times text-red-400 hover:text-red-600 ml-2 delete-node" title="删除节点"></i>
                        </div>
                    </div>
                    ${hasChildren ? `<div class="tree-children ${level > 0 ? 'pl-4' : ''}"></div>` : ''}
                `;

                
                parentElement.appendChild(nodeElement);
                
                // 添加展开/折叠功能
                const toggleIcon = nodeElement.querySelector('.toggle-icon');
                const childrenContainer = nodeElement.querySelector('.tree-children');
                
                if (hasChildren && childrenContainer) {
                    let expanded = false;
                    
                    toggleIcon.addEventListener('click', (e) => {
                        e.stopPropagation();
                        expanded = !expanded;
                        
                        if (expanded) {
                            childrenContainer.style.display = 'block';
                            toggleIcon.innerHTML = '<i class="fas fa-caret-down"></i>';
                            renderTree(item.children, childrenContainer, level + 1);
                        } else {
                            childrenContainer.style.display = 'none';
                            toggleIcon.innerHTML = '<i class="fas fa-caret-right"></i>';
                            childrenContainer.innerHTML = '';
                        }
                    });
                }
                
                // 添加点击事件
                const nodeContent = nodeElement.querySelector('.node-content');
                nodeContent.addEventListener('click', () => {
                    document.querySelectorAll('.node-content').forEach(el => {
                        el.classList.remove('bg-blue-100', 'font-semibold');
                    });
                    nodeContent.classList.add('bg-blue-100', 'font-semibold');
                    
                    // 更新当前选中的节点
                    selectedNode = item;
                    
                    // 显示文件夹内容
                    displayFolderContents(item);

                    let tagCurrentFolder = document.querySelector(".selectedFolder") ;
                    if(tagCurrentFolder == nodeElement) return ;

                    if(tagCurrentFolder!=null)tagCurrentFolder.classList.remove("selectedFolder") ;
                    nodeElement.classList.add('selectedFolder') ;
                });
                
                // 添加删除节点事件
                const deleteBtn = nodeElement.querySelector('.delete-node');
                deleteBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    nodeToDelete = item;
                    showDeleteModal();
                });
                
                // 添加拖拽事件
                nodeElement.addEventListener('dragstart', handleDragStart);
                nodeElement.addEventListener('dragover', handleDragOver);
                nodeElement.addEventListener('dragenter', handleDragEnter);
                nodeElement.addEventListener('dragleave', handleDragLeave);
                nodeElement.addEventListener('drop', handleDrop);
                nodeElement.addEventListener('dragend', handleDragEnd);
            });
        }

        // 高亮目录树中的节点
        function highlightTreeNode(nodeId) {
            // 清除所有高亮
            document.querySelectorAll('.node-content').forEach(el => {
                el.classList.remove('bg-blue-100', 'font-semibold');
            });
            
            // 找到对应节点并高亮
            const nodeElement = document.querySelector(`.tree-node[data-id="${nodeId}"]`);
            if (nodeElement) {
                const nodeContent = nodeElement.querySelector('.node-content');
                nodeContent.classList.add('bg-blue-100', 'font-semibold');
                
                // 确保节点可见（展开父节点）
                let parent = nodeElement.parentElement;
                while (parent && parent.classList.contains('tree-children')) {
                    const parentNode = parent.previousElementSibling;
                    if (parentNode) {
                        const toggleIcon = parentNode.querySelector('.toggle-icon');
                        if (toggleIcon && !toggleIcon.classList.contains('invisible')) {
                            const childrenContainer = parentNode.nextElementSibling;
                            if (childrenContainer.style.display === 'none') {
                                toggleIcon.click();
                            }
                        }
                    }
                    parent = parent.parentElement;
                }
                
                // 滚动到节点位置
                nodeElement.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        }

        // 拖拽相关变量
        let draggedItem = null;

        // 拖拽事件处理函数
        function handleDragStart(e) {
            draggedItem = this;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', this.dataset.id);
            this.classList.add('dragging');
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            return false;
        }

        function handleDragEnter(e) {
            this.classList.add('drag-over');
        }

        function handleDragLeave(e) {
            this.classList.remove('drag-over');
        }

        function handleDrop(e) {
            e.preventDefault();
            this.classList.remove('drag-over');
            
            if (draggedItem !== this) {
                // 检查是否是兄弟节点（简单实现，实际应用中需要更复杂的验证）
                const parent = this.parentElement;
                if (parent === draggedItem.parentElement) {
                    // 获取所有兄弟节点
                    const siblings = Array.from(parent.children);
                    const thisIndex = siblings.indexOf(this);
                    const draggedIndex = siblings.indexOf(draggedItem);
                    
                    if (draggedIndex < thisIndex) {
                        parent.insertBefore(draggedItem, this.nextSibling);
                    } else {
                        parent.insertBefore(draggedItem, this);
                    }
                }
            }
            
            return false;
        }

        function handleDragEnd(e) {
            this.classList.remove('dragging');
            document.querySelectorAll('.tree-node').forEach(node => {
                node.classList.remove('drag-over');
            });
        }

        // 调整侧边栏宽度功能
        function initResizeHandler() {
            const resizeHandle = document.getElementById('resize-handle');
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('main-content');
            
            let isResizing = false;
            
            resizeHandle.addEventListener('mousedown', (e) => {
                isResizing = true;
                resizeHandle.classList.add('active');
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none';
                e.preventDefault();
            });
            
            document.addEventListener('mousemove', (e) => {
                if (!isResizing) return;
                
                const containerRect = sidebar.parentElement.getBoundingClientRect();
                const widthPercentage = ((e.clientX - containerRect.left) / containerRect.width) * 100;
                
                // 设置最小和最大宽度限制
                const newWidth = Math.max(20, Math.min(80, widthPercentage));
                
                sidebar.style.width = `${newWidth}%`;
                mainContent.style.width = `${100 - newWidth}%`;
            });
            
            document.addEventListener('mouseup', () => {
                if (isResizing) {
                    isResizing = false;
                    resizeHandle.classList.remove('active');
                    document.body.style.cursor = '';
                    document.body.style.userSelect = '';
                }
            });
        }

        // 切换左侧导航栏展开/收起状态
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('main-content');
            if (!sidebar) return;

            const isCollapsed = sidebar.classList.toggle('collapsed');
            if (isCollapsed) {

            } else {
                sidebar.style.width = '';
                if (mainContent) mainContent.style.width = '';
                localStorage.setItem('sidebarCollapsed', 'false');
            }
        }

                    if (nodeText.includes(searchTerm)) {
                        treeNode.style.display = 'block';
                        // 展开父节点
                        let parent = treeNode.parentElement;
                        while (parent && parent.classList.contains('tree-children')) {
                            const parentNode = parent.previousElementSibling;
                            if (parentNode) {
                                const toggleIcon = parentNode.querySelector('.toggle-icon');
                                if (toggleIcon && !toggleIcon.classList.contains('invisible')) {
                                    const childrenContainer = parentNode.nextElementSibling;
                                    if (childrenContainer.style.display === 'none') {
                                        toggleIcon.click();
                                    }
                                }
                            }
                            parent = parent.parentElement;
                        }
                    } else {

                });

            // 添加节点按钮事件

        let draggedTabId = null;

        function renderAppShutterTabs() {
            const tabBar = document.getElementById('idAppShutterTabBar');
            if (!tabBar) return;
            tabBar.classList.remove('noShow');
            tabBar.innerHTML = '';

            ensureDefaultAppShutterTabs();

            gAppShutterTabs.forEach(tab => {
                const tabItem = document.createElement('div');
                tabItem.className = `app-tab-item ${tab.id === currentActiveAppTabId ? 'active' : ''}`;
                tabItem.draggable = true;
                tabItem.dataset.tabId = tab.id;
                
                const nameSpan = document.createElement('span');
                nameSpan.textContent = tab.name;
                tabItem.appendChild(nameSpan);

                if (!tab.isFixed && tab.id !== 'default' && tab.id !== 'kanban') {
                    const closeBtn = document.createElement('i');
                    closeBtn.className = 'fas fa-times text-xs opacity-60 hover:opacity-100 ml-1';
                    closeBtn.title = '删除此类目';
                    closeBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (confirm(`确定要删除分类 "${tab.name}" 吗？关联的卡片将转入常用应用分类。`)) {
                            removeAppShutterTab(tab.id);
                            displayDailyTools();
                        }
                    });
                    tabItem.appendChild(closeBtn);
                }

                tabItem.addEventListener('click', () => {
                    currentActiveAppTabId = tab.id;
                    displayDailyTools();
                });

                // HTML5 拖拽事件 - 调整 Tab 标签顺序
                tabItem.addEventListener('dragstart', (e) => {
                    draggedTabId = tab.id;
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('text/plain', tab.id);
                    tabItem.classList.add('dragging-tab');
                });

                tabItem.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                });

                tabItem.addEventListener('dragenter', (e) => {
                    e.preventDefault();
                    if (draggedTabId && draggedTabId !== tab.id) {
                        tabItem.classList.add('drag-over-tab');
                    }
                });

                tabItem.addEventListener('dragleave', () => {
                    tabItem.classList.remove('drag-over-tab');
                });

                tabItem.addEventListener('drop', (e) => {
                    e.preventDefault();
                    tabItem.classList.remove('drag-over-tab');
                    if (draggedTabId && draggedTabId !== tab.id) {
                        const fromIndex = gAppShutterTabs.findIndex(t => t.id === draggedTabId);
                        const toIndex = gAppShutterTabs.findIndex(t => t.id === tab.id);
                        if (fromIndex !== -1 && toIndex !== -1 && fromIndex !== toIndex) {
                            const [movedTab] = gAppShutterTabs.splice(fromIndex, 1);
                            gAppShutterTabs.splice(toIndex, 0, movedTab);
                            reorderAppShutterTabs(gAppShutterTabs);
                            displayDailyTools();
                        }
                    }
                });

                tabItem.addEventListener('dragend', () => {
                    draggedTabId = null;
                    document.querySelectorAll('.app-tab-item').forEach(el => {
                        el.classList.remove('dragging-tab', 'drag-over-tab');
                    });
                });

                tabBar.appendChild(tabItem);
            });

            // 尾部增加新建 Tab "+" 标签按钮
            const addTabBtn = document.createElement('div');
            addTabBtn.className = 'app-tab-add';
            addTabBtn.title = '新建分类 Tab';
            addTabBtn.innerHTML = '<i class="fas fa-plus mr-1"></i> 新建 Tab';
            addTabBtn.addEventListener('click', () => {
                openCreateAppTabModal();
            });
            tabBar.appendChild(addTabBtn);
        }

                    classes += "bg-indigo-50 text-indigo-600 font-extrabold border border-indigo-200";
                } else {
                    classes += "text-gray-700 hover:bg-indigo-50 hover:text-indigo-600";
                }

                cell.className = classes;
                cell.textContent = day;

                cell.onclick = () => {
                    currentKanbanDate = new Date(displayYear, displayMonth, day);
                    displayDailyTools();
                };

                calGrid.appendChild(cell);
            }

            // 填充下个月开头天数
            const totalCellsSoFar = firstDayIndex + daysInMonth;
            const remainingCells = (totalCellsSoFar <= 35 ? 35 : 42) - totalCellsSoFar;
            for (let day = 1; day <= remainingCells; day++) {
                const cell = document.createElement('div');
                cell.className = "text-gray-300 py-1.5 rounded-xl select-none";
                cell.textContent = day;
                calGrid.appendChild(cell);
            }

            // 按钮事件绑定
            container.querySelector('#idBTNCalPrevMonth').onclick = () => {
                kanbanViewMonth--;
                if (kanbanViewMonth < 0) {
                    kanbanViewMonth = 11;
                    kanbanViewYear--;
                }
                displayDailyTools();
            };
            container.querySelector('#idBTNCalNextMonth').onclick = () => {
                kanbanViewMonth++;
                if (kanbanViewMonth > 11) {
                    kanbanViewMonth = 0;
                    kanbanViewYear++;
                }
                displayDailyTools();
            };
            container.querySelector('#idBTNCalToday').onclick = () => {
                currentKanbanDate = new Date();
                kanbanViewYear = currentKanbanDate.getFullYear();
                kanbanViewMonth = currentKanbanDate.getMonth();
                displayDailyTools();
            };
        }

        function _renderKanbanRightContent(container) {
            const totalCount = gKanbanTasks.length;
            const todoTasks = gKanbanTasks.filter(t => t.status === 'todo');
            const inProgressTasks = gKanbanTasks.filter(t => t.status === 'in_progress');
            const completedTasks = gKanbanTasks.filter(t => t.status === 'completed');
            const rateStr = totalCount > 0 ? Math.round((completedTasks.length / totalCount) * 100) + '%' : '0%';

            // 行 1：5 个任务统计 UI 组件
            const row1 = document.createElement('div');
            row1.className = "grid grid-cols-2 sm:grid-cols-5 gap-3 w-full";
            row1.innerHTML = `
                <div class="bg-white rounded-2xl p-3 text-center shadow-sm border border-gray-100 flex flex-col items-center justify-center h-20">
                    <div class="text-2xl font-black text-indigo-600 mb-0.5">${totalCount}</div>
                    <div class="text-xs font-bold text-gray-400">全部</div>
                </div>
                <div class="bg-white rounded-2xl p-3 text-center shadow-sm border border-gray-100 flex flex-col items-center justify-center h-20">
                    <div class="text-2xl font-black text-amber-500 mb-0.5">${todoTasks.length}</div>
                    <div class="text-xs font-bold text-gray-400">待办</div>
                </div>
                <div class="bg-white rounded-2xl p-3 text-center shadow-sm border border-gray-100 flex flex-col items-center justify-center h-20">
                    <div class="text-2xl font-black text-blue-500 mb-0.5">${inProgressTasks.length}</div>
                    <div class="text-xs font-bold text-gray-400">进行中</div>
                </div>
                <div class="bg-white rounded-2xl p-3 text-center shadow-sm border border-gray-100 flex flex-col items-center justify-center h-20">
                    <div class="text-2xl font-black text-emerald-500 mb-0.5">${completedTasks.length}</div>
                    <div class="text-xs font-bold text-gray-400">已完成</div>
                </div>
                <div class="bg-white rounded-2xl p-3 text-center shadow-sm border border-gray-100 flex flex-col items-center justify-center h-20">
                    <div class="text-2xl font-black text-purple-600 mb-0.5">${rateStr}</div>
                    <div class="text-xs font-bold text-gray-400">完成率</div>
                </div>
            `;
            container.appendChild(row1);

            // 行 2：添加任务部分的 UI 组件
            const row2 = document.createElement('div');
            row2.className = "w-full bg-white rounded-2xl shadow-sm border-2 border-dashed border-indigo-200 p-2.5 px-4 flex items-center justify-between gap-3";
            row2.innerHTML = `
                <div class="flex items-center gap-2 flex-1">
                    <span class="text-lg">✍️</span>
                    <input type="text" id="idKanbanNewTaskInput" placeholder="输入新任务，按 Enter 添加..." class="w-full bg-transparent border-none outline-none text-gray-700 text-sm font-medium placeholder-gray-400">
                </div>
                <button id="idBTNKanbanAddTask" class="px-4 py-2 rounded-xl text-white font-bold text-xs shadow hover:shadow-md transition-all flex items-center gap-1.5 whitespace-nowrap" style="background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);">
                    <i class="fas fa-plus text-xs"></i> 添加任务
                </button>
            `;
            container.appendChild(row2);

            // 行 3：三列布局的 待办 / 进行中 / 已完成
            const row3 = document.createElement('div');
            row3.className = "grid grid-cols-1 md:grid-cols-3 gap-5 w-full";
            row3.innerHTML = `
                <!-- 待办列 -->
                <div class="bg-white rounded-2xl shadow-sm border-t-4 border-amber-400 border-gray-100 p-4 min-h-[380px] flex flex-col">
                    <div class="flex items-center justify-between pb-3 mb-3 border-b border-gray-100">
                        <div class="flex items-center gap-2 font-bold text-gray-800 text-sm">
                            <span class="text-amber-500">📌</span> 待办
                        </div>
                        <span class="bg-amber-100 text-amber-700 text-xs font-bold px-2 py-0.5 rounded-full">${todoTasks.length}</span>
                    </div>
                    <div id="col-todo" class="space-y-3 flex-1 overflow-y-auto"></div>
                </div>

                <!-- 进行中列 -->
                <div class="bg-white rounded-2xl shadow-sm border-t-4 border-blue-500 border-gray-100 p-4 min-h-[380px] flex flex-col">
                    <div class="flex items-center justify-between pb-3 mb-3 border-b border-gray-100">
                        <div class="flex items-center gap-2 font-bold text-gray-800 text-sm">
                            <span class="text-blue-500">⏳</span> 进行中
                        </div>
                        <span class="bg-blue-100 text-blue-700 text-xs font-bold px-2 py-0.5 rounded-full">${inProgressTasks.length}</span>
                    </div>
                    <div id="col-in_progress" class="space-y-3 flex-1 overflow-y-auto"></div>
                </div>

                <!-- 已完成列 -->
                <div class="bg-white rounded-2xl shadow-sm border-t-4 border-emerald-500 border-gray-100 p-4 min-h-[380px] flex flex-col">
                    <div class="flex items-center justify-between pb-3 mb-3 border-b border-gray-100">
                        <div class="flex items-center gap-2 font-bold text-gray-800 text-sm">
                            <span class="text-emerald-500">✅</span> 已完成
                        </div>
                        <span class="bg-emerald-100 text-emerald-700 text-xs font-bold px-2 py-0.5 rounded-full">${completedTasks.length}</span>
                    </div>
                    <div id="col-completed" class="space-y-3 flex-1 overflow-y-auto"></div>
                </div>
            `;
            container.appendChild(row3);

            // 渲染各列任务卡片
            const colTodo = container.querySelector('#col-todo');
            const colInProgress = container.querySelector('#col-in_progress');
            const colCompleted = container.querySelector('#col-completed');

            todoTasks.forEach(task => _renderKanbanCard(task, colTodo));
            inProgressTasks.forEach(task => _renderKanbanCard(task, colInProgress));
            completedTasks.forEach(task => _renderKanbanCard(task, colCompleted));

            // 事件绑定：添加任务
            const inputTask = container.querySelector('#idKanbanNewTaskInput');
            const btnAddTask = container.querySelector('#idBTNKanbanAddTask');
            const handleAddTask = () => {
                if (inputTask && inputTask.value.trim()) {
                    addKanbanTask(inputTask.value);
                    displayDailyTools();
                }
            };
            btnAddTask.onclick = handleAddTask;
            inputTask.onkeydown = (e) => {
                if (e.key === 'Enter') handleAddTask();
            };
        }

        function _renderKanbanCard(task, container) {
            const card = document.createElement('div');
            card.className = "bg-white border border-gray-200/80 rounded-xl p-3.5 shadow-sm hover:shadow-md transition-all";

            let badgeHtml = '';
            let actionBtnsHtml = '';

            if (task.status === 'todo') {
                badgeHtml = `<span class="bg-amber-50 text-amber-600 text-[11px] font-bold px-2 py-0.5 rounded-md">待办</span>`;
                actionBtnsHtml = `
                    <button class="btn-move-status text-[11px] font-medium text-gray-500 hover:text-blue-600 bg-gray-100 hover:bg-blue-50 px-2 py-1 rounded transition-colors" data-status="in_progress">→ 进行中</button>
                    <button class="btn-move-status text-[11px] font-medium text-gray-500 hover:text-emerald-600 bg-gray-100 hover:bg-emerald-50 px-2 py-1 rounded transition-colors" data-status="completed">→ 完成</button>
                `;
            } else if (task.status === 'in_progress') {
                badgeHtml = `<span class="bg-blue-50 text-blue-600 text-[11px] font-bold px-2 py-0.5 rounded-md">进行中</span>`;
                actionBtnsHtml = `
                    <button class="btn-move-status text-[11px] font-medium text-gray-500 hover:text-amber-600 bg-gray-100 hover:bg-amber-50 px-2 py-1 rounded transition-colors" data-status="todo">← 待办</button>
                    <button class="btn-move-status text-[11px] font-medium text-gray-500 hover:text-emerald-600 bg-gray-100 hover:bg-emerald-50 px-2 py-1 rounded transition-colors" data-status="completed">→ 完成</button>
                `;
            } else {
                badgeHtml = `<span class="bg-emerald-50 text-emerald-600 text-[11px] font-bold px-2 py-0.5 rounded-md">已完成</span>`;
                actionBtnsHtml = `
                    <button class="btn-move-status text-[11px] font-medium text-gray-500 hover:text-amber-600 bg-gray-100 hover:bg-amber-50 px-2 py-1 rounded transition-colors" data-status="todo">← 待办</button>
                    <button class="btn-move-status text-[11px] font-medium text-gray-500 hover:text-blue-600 bg-gray-100 hover:bg-blue-50 px-2 py-1 rounded transition-colors" data-status="in_progress">← 进行中</button>
                `;
            }

            card.innerHTML = `
                <div class="flex items-start justify-between gap-2 mb-2">
                    <h4 class="text-sm font-bold text-gray-800 leading-snug break-all">${task.title}</h4>
                    <button class="btn-delete-task text-gray-300 hover:text-red-500 text-xs p-0.5 transition-colors" title="删除任务">✕</button>
                </div>
                <div class="flex items-center gap-2 mb-3">
                    ${badgeHtml}
                    <div class="flex items-center gap-1">
                        ${actionBtnsHtml}
                    </div>
                </div>
                <div class="border-t border-dashed border-gray-100 pt-2 flex items-center justify-between gap-2 text-xs">
                    <span class="text-gray-400 truncate max-w-[150px]" title="${task.memo || ''}">${task.memo || '无备注'}</span>
                    <div class="flex items-center gap-1">
                        <input type="text" placeholder="添加备注..." class="input-memo text-[11px] border border-gray-200 rounded px-2 py-0.5 w-24 outline-none focus:border-indigo-400">
                        <button class="btn-save-memo text-xs text-indigo-500 hover:text-indigo-700 bg-indigo-50 w-5 h-5 rounded-full flex items-center justify-center font-bold">+</button>
                    </div>
                </div>
            `;

            // 删除按钮绑定
            card.querySelector('.btn-delete-task').onclick = () => {
                deleteKanbanTask(task.id);
                displayDailyTools();
            };

            // 状态切换按钮绑定
            card.querySelectorAll('.btn-move-status').forEach(btn => {
                btn.onclick = () => {
                    const newStatus = btn.dataset.status;
                    updateKanbanTaskStatus(task.id, newStatus);
                    displayDailyTools();
                };
            });

            // 备注更新绑定
            const memoInput = card.querySelector('.input-memo');
            const memoBtn = card.querySelector('.btn-save-memo');
            const handleMemoSave = () => {
                if (memoInput && memoInput.value.trim()) {
                    updateKanbanTaskMemo(task.id, memoInput.value.trim());
                    displayDailyTools();
                }
            };
            memoBtn.onclick = handleMemoSave;
            memoInput.onkeydown = (e) => {
                if (e.key === 'Enter') handleMemoSave();
            };

            container.appendChild(card);
        }

        function displayDailyTools(){
            let tagCurrentFolder = document.querySelector(".selectedFolder") ;
            if(tagCurrentFolder!=null){
                tagCurrentFolder.classList.remove("selectedFolder") ;
                tagCurrentFolder.querySelector(".font-semibold").classList.remove("font-semibold") ;
                selectedNode = null;
            }

            const folderContents = document.getElementById('idFolderContents');
            const currentFolder = document.getElementById('idCurrentFolderTitle');
            let tagBTNPlusBookmark = document.getElementById("idBTNPlusBookmark") ;
            tagBTNPlusBookmark.classList.add('noShow') ;
            let tagBTNPlusDailyTool = document.getElementById("idBTNPlusDailyTool") ;

            // 1. 更新标题为 "应用快门"
            currentFolder.textContent = "应用快门";
            folderContents.innerHTML=``;

            // 2. 渲染多 Tab 标签栏
            renderAppShutterTabs();

            // 3. 判断是否选中 "每日看板" Tab
            if (currentActiveAppTabId === 'kanban') {
                tagBTNPlusDailyTool.classList.add('noShow');
                document.getElementById('items-count').textContent = `(${gKanbanTasks.length} 个任务)`;
                renderKanbanView(folderContents);
            } else {
                tagBTNPlusDailyTool.classList.remove('noShow');

                // 根据当前激活 Tab 过滤 App 卡片
                const filteredTools = gDialyTools.filter(tool => {
                    if (currentActiveAppTabId === 'default') {
                        return !tool.tabId || tool.tabId === 'default';
                    }
                    return tool.tabId === currentActiveAppTabId;
                });

                document.getElementById('items-count').textContent = `(${filteredTools.length} 个项目)`;

                folderContents.className = "bookmarks-grid grid-view";

                for(let i=0;i<filteredTools.length;i++){
                    _renderDailyTool(filteredTools[i],folderContents) ;
                }

                // 在最末尾添加新增卡片
                _renderAddToolCard(folderContents) ;

                document.querySelector("#idBTNPlusDailyTool").onclick = (event)=>{
                    openPlusDailyToolModal();
                };
            }
        }
    </script>
</body>
</html>
